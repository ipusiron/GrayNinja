<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>GrayNinja - グレイコードのエンコーダー・ディスク可視化ツール</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="js/theme-init.js"></script>
</head>
<body>
<header class="site-header">
  <h1>GrayNinja</h1>
  <p class="subtitle" data-i18n="ui.subtitle"></p>
  <div class="header-buttons">
    <button id="langToggle" type="button" data-i18n="ui.langButton" data-i18n-attr="aria-label:ui.langLabel;title:ui.langLabel"></button>
    <button id="themeToggle" type="button" class="icon-btn"></button>
  </div>
</header>

<noscript><p class="noscript">このページはJavaScriptで動きます。JavaScriptを有効にしてから開き直してください。 / This page needs JavaScript.</p></noscript>

<nav class="tabs" role="tablist" data-i18n-attr="aria-label:ui.tablist">
  <button type="button" class="tab" role="tab" id="tab-basics" data-tab="basics" aria-controls="panel-basics" aria-selected="true" data-i18n="tab.basics"></button>
  <button type="button" class="tab" role="tab" id="tab-how" data-tab="how" aria-controls="panel-how" aria-selected="false" tabindex="-1" data-i18n="tab.how"></button>
  <button type="button" class="tab" role="tab" id="tab-disc" data-tab="disc" aria-controls="panel-disc" aria-selected="false" tabindex="-1" data-i18n="tab.disc"></button>
  <button type="button" class="tab" role="tab" id="tab-convert" data-tab="convert" aria-controls="panel-convert" aria-selected="false" tabindex="-1" data-i18n="tab.convert"></button>
  <button type="button" class="tab" role="tab" id="tab-security" data-tab="security" aria-controls="panel-security" aria-selected="false" tabindex="-1" data-i18n="tab.security"></button>
  <button type="button" class="tab" role="tab" id="tab-learn" data-tab="learn" aria-controls="panel-learn" aria-selected="false" tabindex="-1" data-i18n="tab.learn"></button>
</nav>

<main>
  <!-- 基本 -->
  <section id="panel-basics" class="panel" role="tabpanel" aria-labelledby="tab-basics">
    <div class="panel-single">
      <details class="acc">
        <summary><h2 data-i18n="intro.title"></h2></summary>
        <div class="acc-body">
          <p data-i18n="intro.p1"></p>
          <p class="example mono" data-i18n="intro.ex1"></p>
          <p data-i18n="intro.p2"></p>
          <p class="example mono" data-i18n="intro.ex2"></p>
          <p data-i18n="intro.p3"></p>
          <p data-i18n="intro.p4"></p>
          <p class="note" data-i18n="intro.p5"></p>
        </div>
      </details>

      <details class="acc">
        <summary><h2 data-i18n="ham.title"></h2></summary>
        <div class="acc-body">
          <p data-i18n="ham.p1"></p>
          <div class="example">
            <p data-i18n="ham.example"></p>
            <div class="bitgrid mono" aria-hidden="true">
              <span>1</span><span>0</span><span>1</span><span>0</span>
              <span>1</span><span class="diff">1</span><span class="diff">0</span><span>0</span>
            </div>
            <p data-i18n="ham.result"></p>
          </div>
          <p data-i18n="ham.p2"></p>
        </div>
      </details>

      <section class="box">
        <h2 class="box-title" data-i18n="ctl.title"></h2>
        <div class="control-row">
          <label for="bits" data-i18n="ctl.bits"></label>
          <input id="bits" type="number" min="1" max="12" value="4" inputmode="numeric">
        </div>
        <div class="control-row">
          <label for="valNum" data-i18n="ctl.value"></label>
          <input id="valNum" type="number" min="0" max="15" value="0" inputmode="numeric">
          <input id="val" type="range" min="0" max="15" value="0" data-i18n-attr="aria-label:ctl.valueRange">
        </div>
        <div class="control-row">
          <button id="prev" type="button" data-i18n="ctl.prev"></button>
          <button id="next" type="button" data-i18n="ctl.next"></button>
          <label class="check"><input id="auto" type="checkbox"> <span data-i18n="ctl.auto"></span></label>
          <label class="check"><input id="wrap" type="checkbox" checked> <span data-i18n="ctl.wrap"></span></label>
        </div>
        <div class="control-row range-row">
          <label for="speed" data-i18n="ctl.speed"></label>
          <output id="speedValue" for="speed"></output>
          <input id="speed" type="range" min="100" max="2000" step="100" value="600">
        </div>
        <p class="hint" data-i18n="ctl.keys"></p>
      </section>

      <section class="box">
        <h2 class="box-title" data-i18n="now.title"></h2>
        <div class="cards">
          <div class="card"><div class="k" data-i18n="card.dec"></div><div class="v mono" id="decOut"></div></div>
          <div class="card"><div class="k" data-i18n="card.bin"></div><div class="v mono" id="binOut"></div></div>
          <div class="card"><div class="k" data-i18n="card.gray"></div><div class="v mono" id="grayOut"></div></div>
        </div>
        <div class="card card-next">
          <div class="k"><span data-i18n="card.next"></span>
            <button type="button" class="info" aria-expanded="false" aria-controls="tipNext" data-i18n-attr="aria-label:ui.info">?</button>
          </div>
          <div class="v" id="hdOut"></div>
          <p id="tipNext" class="tip" hidden data-i18n="card.nextTip"></p>
        </div>
        <div class="tableWrap" id="tableWrap" tabindex="0" role="region" data-i18n-attr="aria-label:tbl.wrap">
          <table id="seqTbl" class="mono">
            <caption class="sr-only" data-i18n="tbl.caption"></caption>
            <thead>
              <tr><th scope="col" data-i18n="th.dec"></th><th scope="col" data-i18n="th.bin"></th><th scope="col" data-i18n="th.gray"></th><th scope="col" data-i18n="th.dBin"></th><th scope="col" data-i18n="th.dGray"></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="hint" data-i18n="tbl.hint"></p>
      </section>
    </div>
  </section>

  <!-- しくみ -->
  <section id="panel-how" class="panel" role="tabpanel" aria-labelledby="tab-how" hidden>
    <div class="panel-single">
      <section class="box">
        <h2 class="box-title" data-i18n="ref.title"></h2>
        <p data-i18n="ref.intro"></p>
        <div class="control-row">
          <label for="refBits" data-i18n="ref.bits"></label>
          <input id="refBits" type="number" min="2" max="5" value="3" inputmode="numeric">
        </div>
        <div class="control-row">
          <button id="refPrev" type="button" data-i18n="ref.prev"></button>
          <button id="refNext" type="button" class="primary" data-i18n="ref.next"></button>
          <button id="refReset" type="button" data-i18n="ref.reset"></button>
        </div>
        <p class="dip-status" id="refStatus" aria-live="polite"></p>
        <div class="ref-view mono" id="refView"></div>
        <p class="hint" id="refCheck"></p>
      </section>

      <section class="box">
        <h2 class="box-title" data-i18n="hanoi.title"></h2>
        <p data-i18n="hanoi.intro"></p>
        <div class="control-row">
          <label for="hanoiBits" data-i18n="hanoi.bits"></label>
          <input id="hanoiBits" type="number" min="2" max="6" value="3" inputmode="numeric">
        </div>
        <div class="hanoi" id="hanoiView" aria-hidden="true"></div>
        <p class="dip-status" id="hanoiStatus" aria-live="polite"></p>
        <div class="control-row">
          <button id="hanoiPrev" type="button" data-i18n="hanoi.prev"></button>
          <button id="hanoiNext" type="button" class="primary" data-i18n="hanoi.next"></button>
          <button id="hanoiReset" type="button" data-i18n="hanoi.reset"></button>
        </div>
        <h3 class="sub-title" data-i18n="hanoi.ruler"></h3>
        <p class="ruler mono" id="rulerSeq"></p>
        <h3 class="sub-title" data-i18n="rings.title"></h3>
        <p id="ringsText"></p>
        <p class="source" data-i18n="hanoi.source"></p>
      </section>
    </div>
  </section>

  <!-- ディスク -->
  <section id="panel-disc" class="panel" role="tabpanel" aria-labelledby="tab-disc" hidden>
    <div class="panel-grid">
      <aside class="box controls">
        <h2 class="box-title" data-i18n="disc.title"></h2>
        <div class="control-row">
          <label for="discBits" data-i18n="disc.bits"></label>
          <input id="discBits" type="number" min="1" max="12" value="4" inputmode="numeric">
        </div>
        <div class="control-row">
          <button id="spin" type="button" class="primary" aria-pressed="false"></button>
        </div>
        <div class="control-row range-row">
          <label for="spinSpeed" data-i18n="disc.speed"></label>
          <output id="spinSpeedValue" for="spinSpeed"></output>
          <input id="spinSpeed" type="range" min="5" max="180" step="5" value="30">
        </div>
        <div class="control-row range-row">
          <label for="angle" data-i18n="disc.angle"></label>
          <output id="angleValue" for="angle"></output>
          <input id="angle" type="range" min="0" max="359.9" step="0.1" value="0">
        </div>
        <div class="control-row">
          <button id="prevSector" type="button" data-i18n="disc.prev"></button>
          <button id="nextSector" type="button" data-i18n="disc.next"></button>
        </div>
        <fieldset class="options">
          <legend data-i18n="disc.options"></legend>
          <label class="check"><input id="showNumbers" type="checkbox"> <span data-i18n="disc.optNumbers"></span></label>
          <label class="check"><input id="highlightSector" type="checkbox" checked> <span data-i18n="disc.optHighlight"></span></label>
        </fieldset>
        <fieldset class="options" id="offsetBox">
          <legend data-i18n="mis.title"></legend>
          <label class="check"><input id="offsetOn" type="checkbox"> <span data-i18n="mis.on"></span></label>
          <div class="control-row">
            <label for="offsetPattern" data-i18n="mis.pattern"></label>
            <select id="offsetPattern">
              <option value="alternate" data-i18n="mis.alternate"></option>
              <option value="linear" data-i18n="mis.linear"></option>
              <option value="random" data-i18n="mis.random"></option>
            </select>
          </div>
          <div class="control-row range-row">
            <label for="offsetAmount" data-i18n="mis.amount"></label>
            <output id="offsetAmountValue" for="offsetAmount"></output>
            <input id="offsetAmount" type="range" min="0" max="150" step="5" value="10">
          </div>
          <div class="control-row">
            <button id="offsetShuffle" type="button" data-i18n="mis.shuffle"></button>
          </div>
          <p class="hint" data-i18n="mis.hint"></p>
        </fieldset>
        <h3 class="sub-title" data-i18n="disc.reading"></h3>
        <div class="cards">
          <div class="card"><div class="k" data-i18n="disc.sector"></div><div class="v mono" id="sectorOut"></div></div>
          <div class="card"><div class="k" data-i18n="disc.grayRead"></div><div class="v mono" id="discGray"></div><div class="status" id="discGrayStatus"></div></div>
          <div class="card"><div class="k" data-i18n="disc.binRead"></div><div class="v mono" id="discBinary"></div><div class="status" id="discBinaryStatus"></div></div>
        </div>
      </aside>

      <section class="box viz">
        <div class="discs">
          <figure class="disc-fig">
            <figcaption data-i18n="disc.grayCaption"></figcaption>
            <canvas id="discCanvasGray" role="img"></canvas>
          </figure>
          <figure class="disc-fig">
            <figcaption data-i18n="disc.binCaption"></figcaption>
            <canvas id="discCanvasBinary" role="img"></canvas>
          </figure>
        </div>
        <p class="legend">
          <span class="swatch swatch-0" aria-hidden="true"></span><span data-i18n="disc.legend0"></span>
          <span class="swatch swatch-1" aria-hidden="true"></span><span data-i18n="disc.legend1"></span>
          <span class="swatch swatch-read" aria-hidden="true"></span><span data-i18n="disc.legendText"></span>
        </p>
        <p class="hint" data-i18n="disc.hint"></p>
        <section id="sweepBox" class="sweep" hidden>
          <h3 class="sub-title" data-i18n="sw.title"></h3>
          <p class="hint" id="sweepLead"></p>
          <div class="tableWrap sweep-table">
            <table id="sweepTbl">
              <caption class="sr-only" data-i18n="sw.caption"></caption>
              <thead>
                <tr><th scope="col" data-i18n="sw.thKind"></th><th scope="col" data-i18n="sw.thExact"></th><th scope="col" data-i18n="sw.thAdjacent"></th><th scope="col" data-i18n="sw.thFar"></th><th scope="col" data-i18n="sw.thMax"></th><th scope="col" data-i18n="sw.thExamples"></th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <canvas id="sweepChart" role="img"></canvas>
          <p class="legend">
            <span class="swatch swatch-line swatch-truth" aria-hidden="true"></span><span data-i18n="sw.legendTruth"></span>
            <span class="swatch swatch-line swatch-gray" aria-hidden="true"></span><span data-i18n="sw.legendGray"></span>
            <span class="swatch swatch-line swatch-bin" aria-hidden="true"></span><span data-i18n="sw.legendBin"></span>
            <span class="swatch swatch-read" aria-hidden="true"></span><span data-i18n="sw.legendNow"></span>
          </p>
          <p class="hint" id="sweepOffsets"></p>
          <p class="note" data-i18n="sw.note"></p>
        </section>
      </section>
    </div>
  </section>

  <!-- 変換 -->
  <section id="panel-convert" class="panel" role="tabpanel" aria-labelledby="tab-convert" hidden>
    <div class="twocol">
      <section class="box convBox">
        <h2 class="box-title" data-i18n="conv.b2g"></h2>
        <label for="binIn" data-i18n="conv.binIn"></label>
        <div class="input-row">
          <input id="binIn" type="text" value="1010" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="binHint">
          <button id="toGray" type="button" class="primary" data-i18n="conv.run"></button>
        </div>
        <p id="binHint" class="hint"></p>
        <div class="out" aria-live="polite">
          <code id="grayOut2" class="result"></code>
          <p id="toGrayValue" class="value"></p>
        </div>
        <div class="formula">
          <span class="formula-label" data-i18n="conv.formula"></span>
          <code class="formula-code">g = b ⊕ (b ≫ 1)</code>
          <button type="button" class="info" aria-expanded="false" aria-controls="tipB2G" data-i18n-attr="aria-label:ui.info">?</button>
        </div>
        <p id="tipB2G" class="tip" hidden data-i18n="conv.b2gTip"></p>
        <details class="acc process" open>
          <summary><h3 data-i18n="conv.process"></h3></summary>
          <div id="binaryToGraySteps" class="process-steps"></div>
        </details>
      </section>

      <section class="box convBox">
        <h2 class="box-title" data-i18n="conv.g2b"></h2>
        <label for="grayIn" data-i18n="conv.grayIn"></label>
        <div class="input-row">
          <input id="grayIn" type="text" value="1111" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="grayHint">
          <button id="toBin" type="button" class="primary" data-i18n="conv.run"></button>
        </div>
        <p id="grayHint" class="hint"></p>
        <div class="out" aria-live="polite">
          <code id="binOut2" class="result"></code>
          <p id="toBinValue" class="value"></p>
        </div>
        <div class="formula">
          <span class="formula-label" data-i18n="conv.formula"></span>
          <code class="formula-code">bₙ₋₁ = gₙ₋₁, bᵢ = bᵢ₊₁ ⊕ gᵢ</code>
          <button type="button" class="info" aria-expanded="false" aria-controls="tipG2B" data-i18n-attr="aria-label:ui.info">?</button>
        </div>
        <p id="tipG2B" class="tip" hidden data-i18n="conv.g2bTip"></p>
        <details class="acc process" open>
          <summary><h3 data-i18n="conv.process"></h3></summary>
          <div id="grayToBinarySteps" class="process-steps"></div>
        </details>
      </section>
    </div>
  </section>

  <!-- セキュリティ -->
  <section id="panel-security" class="panel" role="tabpanel" aria-labelledby="tab-security" hidden>
    <div class="panel-single">
      <h2 class="learn-title" data-i18n="sec.title"></h2>
      <p data-i18n="sec.lead"></p>

      <section class="box">
        <h2 class="box-title" data-i18n="leak.title"></h2>
        <p data-i18n="leak.intro"></p>
        <div class="control-row">
          <label for="leakBits" data-i18n="leak.bits"></label>
          <input id="leakBits" type="number" min="2" max="10" value="8" inputmode="numeric">
        </div>
        <div class="control-row">
          <label for="leakModel" data-i18n="leak.model"></label>
          <select id="leakModel">
            <option value="hd" data-i18n="leak.model.hd"></option>
            <option value="hw" data-i18n="leak.model.hw"></option>
            <option value="pos" data-i18n="leak.model.pos"></option>
          </select>
        </div>
        <p class="hint" id="leakModelHint"></p>
        <canvas id="leakChart" role="img"></canvas>
        <p class="legend">
          <span class="swatch swatch-line swatch-bin" aria-hidden="true"></span><span data-i18n="leak.legendBin"></span>
          <span class="swatch swatch-line swatch-gray" aria-hidden="true"></span><span data-i18n="leak.legendGray"></span>
        </p>
        <div class="tableWrap sweep-table">
          <table id="leakTbl">
            <caption class="sr-only" data-i18n="leak.caption"></caption>
            <thead>
              <tr><th scope="col" data-i18n="leak.thCounter"></th><th scope="col" data-i18n="leak.thDistinct"></th><th scope="col" data-i18n="leak.thCandidates"></th><th scope="col" data-i18n="leak.thExamples"></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="hint" id="leakFinding"></p>
        <p class="note" data-i18n="leak.limits"></p>
        <p class="source" data-i18n="leak.source"></p>
      </section>

      <section class="box">
        <h2 class="box-title" data-i18n="dip.title"></h2>
        <p data-i18n="dip.intro"></p>
        <div class="control-row">
          <label for="dipBits" data-i18n="dip.bits"></label>
          <input id="dipBits" type="number" min="1" max="16" value="4" inputmode="numeric">
        </div>
        <div class="control-row">
          <label for="dipOrder" data-i18n="dip.order"></label>
          <select id="dipOrder">
            <option value="binary" data-i18n="dip.order.binary"></option>
            <option value="gray" data-i18n="dip.order.gray"></option>
          </select>
        </div>
        <div class="dip-row" id="dipRow" aria-hidden="true"></div>
        <p class="dip-status" id="dipStatus" aria-live="polite"></p>
        <div class="control-row">
          <button id="dipPrev" type="button" data-i18n="dip.prev"></button>
          <button id="dipNext" type="button" class="primary" data-i18n="dip.next"></button>
          <button id="dipReset" type="button" data-i18n="dip.reset"></button>
        </div>
        <div class="tableWrap sweep-table">
          <table id="dipTbl">
            <caption class="sr-only" data-i18n="dip.caption"></caption>
            <thead>
              <tr><th scope="col" data-i18n="dip.thOrder"></th><th scope="col" data-i18n="dip.thTotal"></th><th scope="col" data-i18n="dip.thPer"></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <h3 class="sub-title" data-i18n="db.title"></h3>
        <p id="dbText"></p>
        <p class="mono db-seq" id="dbSeq"></p>
        <p class="source" data-i18n="db.source"></p>
      </section>
    </div>
  </section>

  <!-- 座学 -->
  <section id="panel-learn" class="panel" role="tabpanel" aria-labelledby="tab-learn" hidden>
    <div class="panel-single">
      <h2 class="learn-title" data-i18n="learn.title"></h2>
      <p data-i18n="learn.lead"></p>
      <h3 class="section-title" data-i18n="learn.history"></h3>
      <div class="ucards" id="learnHistory"></div>
      <h3 class="section-title" data-i18n="learn.uses"></h3>
      <div class="ucards" id="learnUses"></div>
      <h3 class="section-title" data-i18n="learn.security"></h3>
      <div class="ucards" id="learnSecurity"></div>
      <h3 class="section-title" data-i18n="learn.myths"></h3>
      <ul class="myths" id="learnMyths"></ul>
    </div>
  </section>
</main>

<footer class="site-footer">
  <a href="https://github.com/ipusiron/GrayNinja" target="_blank" rel="noopener noreferrer" data-i18n="ui.repo"></a>
</footer>

<script src="js/gray-core.js"></script>
<script src="js/messages.js"></script>
<script src="js/i18n.js"></script>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>
</body>
</html>
